name: Windows Desktop Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  desktop:
    name: Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Run test suites (sync + recovery + AI)
        shell: bash
        run: |
          node scripts/mock-github.mjs 9801 > /tmp/mock-sync.log 2>&1 &
          node scripts/mock-openai.mjs 9911 > /tmp/mock-ai.log 2>&1 &
          sleep 2
          bun scripts/test-recovery.ts | tail -2
          bun scripts/test-sync.ts | tail -2
          bun scripts/test-ai.ts | tail -2

      - name: Build static export (shared web bundle)
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: /open-writer

      - name: Verify shared bundle
        shell: bash
        run: |
          test -f out/index.html
          test -d out/_next
          ! grep -q 'src="/_next' out/index.html

      - name: Package Windows app (NSIS installer + portable)
        run: bunx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify artifacts
        shell: bash
        run: |
          ls -la dist/
          test -f "dist/Open-Writer-Setup-1.0.0-x64.exe"
          test -f "dist/Open-Writer-Portable-1.0.0-x64.exe"
          test -f "dist/win-unpacked/Open Writer.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Open-Writer-Setup
          path: dist/Open-Writer-Setup-1.0.0-x64.exe
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: Open-Writer-Portable
          path: dist/Open-Writer-Portable-1.0.0-x64.exe
          if-no-files-found: error

      - name: Upload unpacked dir
        uses: actions/upload-artifact@v4
        with:
          name: Open-Writer-win-unpacked
          path: dist/win-unpacked/
          if-no-files-found: error
